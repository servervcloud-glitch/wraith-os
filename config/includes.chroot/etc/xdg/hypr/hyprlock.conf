# Wraith lock screen (hyprlock). Used when ~/.config/hypr/hyprlock.conf
# doesn't exist; copy it there to make your own.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    color = rgba(19, 19, 24, 1.0)
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Sans
    color = rgba(230, 225, 240, 1.0)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 20
    font_family = Sans
    color = rgba(200, 197, 208, 1.0)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(106, 95, 240, 1.0)
    inner_color = rgba(36, 34, 44, 0.9)
    font_color = rgba(230, 225, 240, 1.0)
    check_color = rgba(155, 230, 180, 1.0)
    fail_color = rgba(255, 140, 140, 1.0)
    placeholder_text = Password
    fail_text = Wrong password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = Wraith
    font_size = 14
    font_family = Sans
    color = rgba(200, 197, 208, 0.7)
    position = 0, 30
    halign = center
    valign = bottom
}
