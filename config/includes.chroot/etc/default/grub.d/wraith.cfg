# Wraith OS - installed system boot menu
GRUB_DISTRIBUTOR="Wraith OS"
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_THEME=/boot/grub/themes/wraith/theme.txt
# Kali's GRUB script puts its own wallpaper behind "Booting ... Loading Linux"
GRUB_BACKGROUND=/usr/share/wraith/grub-bg.png
GRUB_GFXMODE=1920x1080,auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=false wraith.mode=installed slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 pti=on randomize_kstack_offset=on vsyscall=none debugfs=off apparmor=1 security=apparmor"
GRUB_DISABLE_OS_PROBER=false
