# Wraith USB protection.
# Devices plugged in while the session is unlocked work normally (Wi-Fi
# adapters, SDRs, keyboards). While the screen is locked, `wraith-usb lock`
# switches new devices to "block", so nothing can be plugged in behind your back.
RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=allow
PresentDevicePolicy=allow
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy
AuthorizedDefault=none
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
IPCAllowedUsers=root
IPCAllowedGroups=
DeviceRulesWithPort=false
AuditBackend=FileAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log
HidePII=false
