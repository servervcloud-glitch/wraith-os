# Wraith OS - Hyprland (window manager) settings, crafted by VIPIN
# Your own changes are best kept at the end of this file.

monitor = , preferred, auto, auto
# display scale chosen in Settings > Sound & display
source = ~/.config/hypr/wraith-display.conf

env = XCURSOR_THEME, Wraith
env = XCURSOR_SIZE, 24
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = QT_QPA_PLATFORM, wayland;xcb
env = GDK_BACKEND, wayland,x11
env = MOZ_ENABLE_WAYLAND, 1

exec-once = hyprctl setcursor Wraith 24
exec-once = /usr/local/bin/wraith-shell
exec-once = /usr/libexec/hyprpolkitagent
exec-once = mako
exec-once = wraith-welcome-once

input {
    kb_layout = us
    follow_mouse = 1
    accel_profile = adaptive
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 0
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 18
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000055)
    }
}

# Springy Pixel-style motion: windows pop in and out, workspaces slide
animations {
    enabled = true
    bezier = spring, 0.34, 1.56, 0.64, 1
    bezier = emph, 0.2, 0, 0, 1
    animation = windowsIn, 1, 5, spring, popin 80%
    animation = windowsOut, 1, 4, emph, popin 85%
    animation = windowsMove, 1, 5, spring
    animation = fade, 1, 4, emph
    animation = workspaces, 1, 5, emph, slide
    animation = layers, 1, 4, emph, fade
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

# Wraith's own apps open as centred floating windows
windowrule = float on, match:class ^(os\.wraith\.(Settings|Apps|Welcome))$
windowrule = center on, match:class ^(os\.wraith\.(Settings|Apps|Welcome))$
# (their size comes from wraith-app, which fits it to the screen)

# ---- keyboard shortcuts (Super = the Windows key) ----
$mod = SUPER
bindr = $mod, SUPER_L, exec, wraith-shell-ctl drawer
bind = $mod, A, exec, wraith-shell-ctl drawer
bind = $mod, S, exec, wraith-shell-ctl qs
bind = $mod, Return, exec, wraith-app terminal
bind = $mod, T, exec, wraith-app terminal
bind = $mod, I, exec, wraith-app settings
bind = $mod, E, exec, nautilus
bind = $mod, Q, killactive
bind = $mod, H, exec, wraith-minimize
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, V, togglefloating
bind = $mod, L, exec, wraith-lock
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# laptop keys (the Dynamic Island shows the new level)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && wraith-shell-ctl osd-volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wraith-shell-ctl osd-volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && wraith-shell-ctl osd-volume
bindel = , XF86MonBrightnessUp, exec, brightnessctl -c backlight set 5%+ && wraith-shell-ctl osd-brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -c backlight set 5%- && wraith-shell-ctl osd-brightness
