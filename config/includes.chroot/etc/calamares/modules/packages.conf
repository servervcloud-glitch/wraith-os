# Wraith: after installing, take the live-system packages out of the new
# system. try_remove skips any that aren't there - the plain edition doesn't
# have them all, and a plain "remove" of a missing package stopped the install
# with apt error 100.
---
backend: apt
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - calamares-settings-debian
