# Random MAC address for every Wi-Fi scan and every connection,
# and no hostname sent over DHCP.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
connection.llmnr=0
connection.mdns=0

[main]
hostname-mode=none
