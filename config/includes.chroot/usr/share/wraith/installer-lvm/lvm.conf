# LVM settings for the installer only (wraith-install sets LVM_SYSTEM_DIR to
# this folder). LVM sees no devices, so Calamares lists only real disks: an
# old install's volume group (e.g. "ubuntu-vg") otherwise shows up as a disk,
# and installing to it fails with "failed to create a partition table".
devices {
    global_filter = [ "r|.*|" ]
}
