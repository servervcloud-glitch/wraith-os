name: Build Wraith OS

# Runs only on Vipin's own server (self-hosted runner, label wraith-builder),
# so builds are free, private and have no disk or time limits.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: wraith-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: [self-hosted, linux, wraith-builder]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to compare with an unfinished build

      - name: Check disk space
        run: |
          df -h "$HOME"
          free_gb=$(df --output=avail -BG "$HOME" | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -lt 60 ]; then
            echo "::error::Only ${free_gb} GB free, the build needs about 100 GB"; exit 1
          fi

      - name: Build ISO in a Kali container
        run: |
          # Cache and work tree must be on ONE mount: live-build hard-links
          # cached packages into the build, which fails across mounts.
          if [ -d "$HOME/wraith-cache" ] && [ ! -e "$HOME/wraith/cache" ]; then
            mkdir -p "$HOME/wraith" && mv "$HOME/wraith-cache" "$HOME/wraith/cache"
          fi
          # Old separate work folder from an earlier version (root-owned files,
          # so remove it from inside a container)
          if [ -d "$HOME/wraith-work" ]; then
            docker run --rm -v "$HOME:/h" kalilinux/kali-rolling rm -rf /h/wraith-work || true
          fi
          mkdir -p "$HOME/wraith/cache" "$HOME/wraith/work" "$HOME/wraith-builds"

          # If a build is still running (GitHub lost contact but the PC kept
          # going), follow that one instead of starting another.
          if [ "$(docker inspect -f '{{.State.Running}}' wraith-build 2>/dev/null)" = "true" ]; then
            echo "A build is already running on this PC - following it"
          else
            docker rm -f wraith-build >/dev/null 2>&1 || true
            # Retry the image download if the connection drops
            for i in 1 2 3 4 5 6; do
              docker pull kalilinux/kali-rolling && break
              [ $i -eq 6 ] && exit 1
              echo "Download interrupted, retrying ($i/6) in 20 s..."; sleep 20
            done
            # Detached + named: the build keeps going even if this job is cut off,
            # and the work tree on the PC lets a new run resume after a restart.
            # Resume an unfinished build if the OS itself hasn't changed since
            # it started (changes to this workflow or docs don't matter).
            BUILD_ID="$GITHUB_SHA"
            prev=$(cat "$HOME/wraith/work/.wraith-commit" 2>/dev/null || true)
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null \
               && git diff --quiet "$prev" "$GITHUB_SHA" -- auto config branding build.sh; then
              BUILD_ID="$prev"
              echo "The OS hasn't changed since the unfinished build ($prev) - resuming it"
            fi
            docker run -d --name wraith-build --privileged \
              -e WRAITH_COMMIT="$BUILD_ID" \
              -v "$GITHUB_WORKSPACE:/src:ro" \
              -e CACHE=/wraith/cache -e WORK=/wraith/work \
              -v "$HOME/wraith:/wraith" \
              -v "$HOME/wraith-builds:/out" \
              kalilinux/kali-rolling \
              nice -n 19 ionice -c 3 bash /src/build.sh >/dev/null
            # ^ lowest CPU and disk priority: compressing the ISO uses every core
            #   for an hour or more, and the GitHub runner must keep enough CPU to
            #   stay in touch (otherwise GitHub marks the job "lost communication").
          fi

          # Heartbeat: some steps (compressing the ISO) print nothing for a long
          # time, so show a line every 5 minutes to prove the build is alive.
          ( while docker inspect -f '{{.State.Running}}' wraith-build 2>/dev/null | grep -q true; do
              sleep 300; echo "[wraith] still working... $(date -u +%H:%M) UTC, work tree $(du -sh "$HOME/wraith/work" 2>/dev/null | cut -f1)"
            done ) &
          docker logs -f wraith-build &
          code=$(docker wait wraith-build)
          sleep 2
          docker rm wraith-build >/dev/null 2>&1 || true
          exit "$code"

      - name: Keep only the newest ISO (saves ~13 GB per old build)
        run: |
          cd "$HOME/wraith-builds"
          ls -1t wraith-*.iso 2>/dev/null | tail -n +2 | while read -r f; do rm -f "$f" "$f.sha256"; done
          ls -lh
