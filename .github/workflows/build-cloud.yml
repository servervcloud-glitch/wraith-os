name: Build Wraith OS (cloud, encrypted)

# Builds the ISO on GitHub's own machines (free and unlimited for public
# repos), so the home PC isn't needed. The finished ISO is encrypted BEFORE it
# is uploaded, to the public key in keys/wraith-iso-public.asc (safe to be
# public: it can only lock). Only the owner's unlock file (never in the repo)
# can open it - no passphrase to mistype. Then it's split into parts under
# 2 GB and attached to a GitHub Release.
on:
  workflow_dispatch:

concurrency:
  group: wraith-cloud
  cancel-in-progress: false

permissions:
  contents: write   # to create the release

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's hard limit is 6 hours
    steps:
      - name: Free disk space (the build needs ~70 GB)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /build

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Move Docker storage to the big build disk
        run: |
          # The space was freed into /build (100 GB), but Docker keeps its
          # images on the small system disk by default - move it.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /build/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '. + {"data-root": "/build/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          else
            echo '{"data-root": "/build/docker"}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          fi
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker storage: {{.DockerRootDir}}'
          df -h / /build

      - name: Build ISO in a Kali container
        run: |
          df -h /build
          sudo mkdir -p /build/cache /build/work /build/out
          # Disk is tight on GitHub's machines: once the ISO stage starts, the
          # downloaded-package cache is no longer needed here, so free it.
          ( until ls /build/work/.build/binary_* >/dev/null 2>&1; do sleep 60; done
            sudo rm -rf /build/cache/packages.* && echo "[wraith] freed the package cache"
          ) &
          docker run --rm --privileged \
            -e WRAITH_COMMIT="$GITHUB_SHA" \
            -e CACHE=/build/cache -e WORK=/build/work -e OUT=/build/out \
            -v "$GITHUB_WORKSPACE/src:/src:ro" \
            -v /build:/build \
            kalilinux/kali-rolling bash /src/build.sh
          sudo chown -R "$(id -u):$(id -g)" /build/out
          ls -lh /build/out
          df -h /build

      - name: Encrypt (to the owner's key) and split into parts under 2 GB
        run: |
          KEY="$GITHUB_WORKSPACE/src/keys/wraith-iso-public.asc"
          if [ ! -s "$KEY" ]; then
            echo "::error::keys/wraith-iso-public.asc is missing - refusing to publish an unencrypted ISO."
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import "$KEY"
          FPR=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr/{print $10; exit}')
          cd /build/out
          ISO=$(ls -1 wraith-*.iso | head -n1)
          NAME="${ISO%.iso}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          gpg --batch --yes --trust-model always --recipient "$FPR" --compress-algo none \
              --encrypt -o - "$ISO" | split -b 1900M -d -a 2 - "$NAME.iso.gpg.part"
          rm -f "$ISO" "$ISO.sha256"
          sha256sum "$NAME".iso.gpg.part* > "$NAME.parts.sha256"
          ls -lh

      - name: Publish the encrypted parts as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /build/out
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          cat > notes.md <<EOF
          Encrypted Wraith OS ISO. Unusable without the owner's unlock key file.

          To use it, download every \`.part\` file and the \`.parts.sha256\` file into one folder, then in Ubuntu/WSL or Linux:

          \`\`\`bash
          sha256sum -c $NAME.parts.sha256
          gpg --import wraith-iso-unlock-key.asc
          gpg -d -o $NAME.iso <(cat $NAME.iso.gpg.part*)
          \`\`\`

          Then use \`$NAME.iso\` in a VM or write it to a 32 GB+ USB stick.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Wraith OS $TAG (encrypted)" \
            --notes-file notes.md "$NAME".iso.gpg.part* "$NAME.parts.sha256"
