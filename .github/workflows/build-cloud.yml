name: Build Wraith OS (cloud)

# Builds the ISO on GitHub's own machines (free and unlimited for public
# repos), so the home PC isn't needed. GitHub release files are limited to
# 2 GB each, so the ISO is split into parts; one command joins them back
# into a single ISO (see the release notes). Not encrypted: while the repo
# is public, anyone can download it.
on:
  workflow_dispatch:

concurrency:
  group: wraith-cloud
  cancel-in-progress: false

permissions:
  contents: write   # to create the release

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's hard limit is 6 hours
    steps:
      - name: Free disk space (the build needs ~70 GB)
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /build

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Move Docker storage to the big build disk
        run: |
          # The space was freed into /build (100 GB), but Docker keeps its
          # images on the small system disk by default - move it.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /build/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '. + {"data-root": "/build/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          else
            echo '{"data-root": "/build/docker"}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          fi
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker storage: {{.DockerRootDir}}'
          df -h / /build

      - name: Build ISO in a Kali container
        run: |
          df -h /build
          sudo mkdir -p /build/cache /build/work /build/out
          # Disk is tight on GitHub's machines: once the ISO stage starts, the
          # downloaded-package cache is no longer needed here, so free it.
          ( until ls /build/work/.build/binary_* >/dev/null 2>&1; do sleep 60; done
            sudo rm -rf /build/cache/packages.* && echo "[wraith] freed the package cache"
          ) &
          docker run --rm --privileged \
            -e WRAITH_COMMIT="$GITHUB_SHA" \
            -e CACHE=/build/cache -e WORK=/build/work -e OUT=/build/out \
            -v "$GITHUB_WORKSPACE/src:/src:ro" \
            -v /build:/build \
            kalilinux/kali-rolling bash /src/build.sh
          sudo chown -R "$(id -u):$(id -g)" /build/out
          ls -lh /build/out
          df -h /build

      - name: Split into parts under 2 GB (GitHub's limit per release file)
        run: |
          cd /build/out
          ISO=$(ls -1 wraith-*.iso | head -n1)
          NAME="${ISO%.iso}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          sha256sum "$ISO" > "$NAME.iso.sha256"          # checksum of the joined ISO
          split -b 1900M -d -a 2 "$ISO" "$ISO.part"
          rm -f "$ISO"
          ls -lh

      - name: Publish the parts as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /build/out
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          cat > notes.md <<EOF
          Wraith OS ISO, split into parts (GitHub allows at most 2 GB per file).

          Download every \`.part\` file and \`$NAME.iso.sha256\` into one folder, then join them into a single ISO.

          **Windows** (PowerShell, in that folder):
          \`\`\`
          cmd /c copy /b $NAME.iso.part* $NAME.iso
          \`\`\`

          **Linux / WSL:**
          \`\`\`
          cat $NAME.iso.part* > $NAME.iso
          \`\`\`

          Check it (optional): the SHA256 of \`$NAME.iso\` must match \`$NAME.iso.sha256\`
          (Windows: \`Get-FileHash $NAME.iso\`).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Wraith OS $TAG" \
            --notes-file notes.md "$NAME".iso.part* "$NAME.iso.sha256"
